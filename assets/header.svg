    <circle class="spark" cx="746" cy="321" r="1.3" style="animation-duration:11.8s;animation-delay:-5.9s"/>
    <circle class="spark" cx="238" cy="338" r="2.4" style="animation-duration:14.0s;animation-delay:-8.9s"/>
    <circle class="spark" cx="1047" cy="313" r="1.1" style="animation-duration:11.2s;animation-delay:-1.9s"/>
    <circle class="spark" cx="597" cy="328" r="2.0" style="animation-duration:13.6s;animation-delay:-6.7s"/>
    <circle class="spark" cx="225" cy="332" r="1.1" style="animation-duration:11.3s;animation-delay:-7.3s"/>
    <circle class="spark" cx="674" cy="330" r="2.0" style="animation-duration:8.9s;animation-delay:-10.5s"/>
    <circle class="spark" cx="31" cy="338" r="1.7" style="animation-duration:7.6s;animation-delay:-10.1s"/>
    <g transform="translate(30 -24) scale(1.05)"><path class="petal" style="--d:-72px;animation-duration:11.6s;animation-delay:-3.8s;opacity:0.59" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(405 -24) scale(0.95)"><path class="petal" style="--d:-78px;animation-duration:15.8s;animation-delay:-9.8s;opacity:0.64" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(961 -24) scale(0.65)"><path class="petal" style="--d:-76px;animation-duration:12.4s;animation-delay:-12.7s;opacity:0.37" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(810 -24) scale(0.78)"><path class="petal" style="--d:-145px;animation-duration:17.3s;animation-delay:-14.5s;opacity:0.58" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(1082 -24) scale(0.91)"><path class="petal" style="--d:-51px;animation-duration:14.8s;animation-delay:-10.4s;opacity:0.76" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
