    <circle class="spark" cx="1103" cy="345" r="1.9" style="animation-duration:13.1s;animation-delay:-0.5s"/>
    <circle class="spark" cx="1060" cy="316" r="2.4" style="animation-duration:13.6s;animation-delay:-10.7s"/>
    <circle class="spark" cx="504" cy="340" r="2.0" style="animation-duration:13.1s;animation-delay:-5.6s"/>
