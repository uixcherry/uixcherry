    <ellipse class="blob b3" cx="640" cy="330" rx="420" ry="160" fill="url(#blobC)"/>

    <circle class="spark" cx="93" cy="334" r="1.0" style="animation-duration:6.6s;animation-delay:-13.9s"/>
