    <text x="264" y="208" class="name" fill="url(#nameGrad)" filter="url(#nameGlow)">uixcherry</text>
    <text x="234" y="268" class="prompt">&gt;_</text>
    
    <clipPath id="c0"><rect x="268" y="242" height="36" width="0">
      <animate id="t0" attributeName="width" begin="0s;t4.end" dur="5s" fill="freeze"
        values="0;460.8;460.8;0" keyTimes="0;0.36;0.84;1"/>
    </rect></clipPath>
    <text clip-path="url(#c0)" x="268" y="268" textLength="460.8" lengthAdjust="spacingAndGlyphs" class="type">full-stack dev · TypeScript &amp; C#</text>
    <rect x="268" y="247" width="3" height="27" rx="1" class="cursor" opacity="0">
