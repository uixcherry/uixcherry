        <circle class="node" cx="1144" cy="170" r="5"/>
        <circle class="node" cx="960" cy="246" r="3.5" style="fill:#ff8fab"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1036 170" to="360 1036 170" dur="24s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle class="ring r2" cx="1036" cy="170" r="70"/>
        <circle class="node" cx="1036" cy="100" r="4" style="fill:#c084fc"/>
        <animateTransform attributeName="transform" type="rotate" from="360 1036 170" to="0 1036 170" dur="16s" repeatCount="indefinite"/>
      </g>
      <g class="core">
        <rect x="998" y="132" width="76" height="76" rx="20" fill="#1b1220" stroke="#ff4d6d" stroke-width="1.5" filter="url(#glow)"/>
        <text x="1036" y="179" text-anchor="middle" style="font: 700 26px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #ff4d6d;">&lt;/&gt;</text>
      </g>
      <g class="chip" style="animation-delay:-0s"><rect x="840" y="57" width="120" height="30" rx="15"/><text x="900" y="77" text-anchor="middle">TypeScript</text></g>
      <g class="chip" style="animation-delay:-1.2s"><rect x="1117.6" y="71" width="44.8" height="30" rx="15"/><text x="1140" y="91" text-anchor="middle">C#</text></g>
      <g class="chip" style="animation-delay:-2.1s"><rect x="1114.2" y="243" width="63.6" height="30" rx="15"/><text x="1146" y="263" text-anchor="middle">.NET</text></g>
      <g class="chip" style="animation-delay:-0.6s"><rect x="872.1" y="257" width="91.8" height="30" rx="15"/><text x="918" y="277" text-anchor="middle">Next.js</text></g>
    </g>

    <!-- cherry -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 150 78;6 150 78;-6 150 78" dur="4.5s" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" repeatCount="indefinite"/>
      <ellipse cx="150" cy="248" rx="70" ry="10" fill="#000" opacity=".35" filter="url(#soft)"/>
      <path d="M150 78C140 120 124 150 116 182" fill="none" stroke="#5b3a1e" stroke-width="5" stroke-linecap="round"/>
      <path d="M150 78C160 120 178 156 184 194" fill="none" stroke="#5b3a1e" stroke-width="5" stroke-linecap="round"/>
      <path d="M150 80C168 56 200 54 214 66C196 86 168 90 150 80Z" fill="url(#leaf)"/>
      <path d="M152 79C172 70 192 66 210 67" fill="none" stroke="#166534" stroke-width="1.5" opacity=".7"/>
      <circle cx="114" cy="206" r="33" fill="url(#cherry)"/>
      <circle cx="186" cy="218" r="33" fill="url(#cherry)"/>
