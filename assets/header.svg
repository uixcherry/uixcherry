<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-labelledby="title desc">
  <title id="title">uixcherry</title>
  <desc id="desc">Animated banner: Hi there, I'm uixcherry, a full-stack developer building platforms, tools and bots for game servers with TypeScript and C#.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="360" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0a12"/><stop offset=".55" stop-color="#110a10"/><stop offset="1" stop-color="#1a0710"/>
    </linearGradient>
    <radialGradient id="blobA"><stop offset="0" stop-color="#ff2e63" stop-opacity=".55"/><stop offset="1" stop-color="#ff2e63" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobB"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".40"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
    <radialGradient id="blobC"><stop offset="0" stop-color="#ff8fab" stop-opacity=".28"/><stop offset="1" stop-color="#ff8fab" stop-opacity="0"/></radialGradient>
    <linearGradient id="nameGrad" gradientUnits="userSpaceOnUse" x1="240" y1="0" x2="780" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#ffd6e0"/><stop offset=".3" stop-color="#ff4d6d"/><stop offset=".6" stop-color="#c084fc"/><stop offset="1" stop-color="#ffd6e0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;540 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2e63"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#ff2e63"/>
    </linearGradient>
    <radialGradient id="cherry" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff8fa3"/><stop offset=".45" stop-color="#e5113e"/><stop offset="1" stop-color="#6d0019"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#15803d"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <mask id="gridMask"><rect width="1200" height="360" fill="url(#fade)"/></mask>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="nameGlow" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feComponentTransfer in="b" result="f"><feFuncA type="linear" slope=".6"/></feComponentTransfer><feMerge><feMergeNode in="f"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <style>
    .label { font: 600 17px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 6px; fill: #ff8fab; }
    .name  { font: 800 104px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; letter-spacing: -2px; }
    .type  { font: 500 24px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #f1e7ec; }
    .prompt{ font: 700 24px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #ff4d6d; }
    .cursor{ fill: #ff4d6d; animation: blink 1s steps(1) infinite; }
    .petal { fill: #ffb3c6; transform-box: fill-box; transform-origin: center; animation: fall linear infinite; }
    .spark { fill: #ff8fab; animation: rise linear infinite; }
    .blob  { animation: drift 16s ease-in-out infinite alternate; }
    .blob.b2 { animation-duration: 21s; animation-direction: alternate-reverse; }
    .blob.b3 { animation-duration: 13s; }
    .w1 { animation: slide 14s linear infinite; }
    .w2 { animation: slide 22s linear infinite reverse; }
    .chip { animation: bob 5s ease-in-out infinite; }
    .chip rect { fill: #1b1220; stroke: #ff4d6d; stroke-opacity: .45; }
    .chip text { font: 600 15px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #ffd6e0; }
    .core { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ring { fill: none; stroke: #ff4d6d; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 10; }
    .ring.r2 { stroke: #c084fc; stroke-dasharray: 2 8; }
    .ring.r3 { stroke-opacity: .18; stroke-dasharray: 1 6; }
    .node { fill: #ff4d6d; filter: url(#soft); }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes fall {
      0%   { transform: translate(0, 0) rotate(0deg); }
      50%  { transform: translate(calc(var(--d) * .6), 210px) rotate(200deg); }
      100% { transform: translate(var(--d), 420px) rotate(400deg); }
    }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .9; } 100% { transform: translateY(-300px); opacity: 0; } }
    @keyframes drift { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(120px, -30px) scale(1.15); } }
    @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

