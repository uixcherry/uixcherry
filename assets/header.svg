    <g transform="translate(97 -24) scale(0.66)"><path class="petal" style="--d:-109px;animation-duration:14.0s;animation-delay:-9.2s;opacity:0.44" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(1066 -24) scale(0.53)"><path class="petal" style="--d:-80px;animation-duration:12.3s;animation-delay:-6.2s;opacity:0.77" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(617 -24) scale(0.60)"><path class="petal" style="--d:-116px;animation-duration:12.7s;animation-delay:-5.1s;opacity:0.54" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(409 -24) scale(0.82)"><path class="petal" style="--d:-51px;animation-duration:14.5s;animation-delay:-4.2s;opacity:0.56" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(1014 -24) scale(0.88)"><path class="petal" style="--d:-99px;animation-duration:14.7s;animation-delay:-9.3s;opacity:0.66" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(1101 -24) scale(0.74)"><path class="petal" style="--d:-90px;animation-duration:15.4s;animation-delay:-4.5s;opacity:0.51" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>
    <g transform="translate(407 -24) scale(0.73)"><path class="petal" style="--d:-147px;animation-duration:16.2s;animation-delay:-15.8s;opacity:0.72" d="M0 0C5-9 17-8 18 0C17 8 5 9 0 0Z"/></g>

    <!-- orbit deco -->
    <g>
      <circle class="ring r3" cx="1036" cy="170" r="150">
        <animateTransform attributeName="transform" type="rotate" from="0 1036 170" to="360 1036 170" dur="80s" repeatCount="indefinite"/>
