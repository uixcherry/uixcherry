<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-labelledby="t">
  <title id="t">Let's turn ideas into scalable, innovative solutions.</title>
  <defs>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff2e63"/><stop offset=".5" stop-color="#c026d3"/><stop offset="1" stop-color="#ff2e63"/></linearGradient>
