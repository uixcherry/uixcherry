<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="t d">
  <title id="t">Forge.Defcon</title>
  <desc id="d">Forge.Defcon (public): WPF scanner for consent-based PC checks: 20 modules that hunt cheats, HWID spoofers and DMA hardware. Single-exe CI releases. Tech: C#, .NET 9, WPF, MVVM, SQLite, Actions.</desc>
  <defs>
    <clipPath id="card"><rect width="520" height="270" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120e17"/><stop offset="1" stop-color="#0c0a10"/></linearGradient>
    <radialGradient id="blob"><stop offset="0" stop-color="#38bdf8" stop-opacity=".30"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bae6fd"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="270" spreadMethod="repeat">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".12"/><stop offset=".45" stop-color="#38bdf8" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#bae6fd" stop-opacity=".95"/><stop offset=".55" stop-color="#38bdf8" stop-opacity=".12"/><stop offset="1" stop-color="#38bdf8" stop-opacity=".12"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-520 -270;520 270" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .name { font: 700 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f8f1f4; }
    .sub  { font: 500 13px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #bae6fd; opacity: .85; }
    .desc { font: 400 15.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #c9bfc6; }
    .tag  { fill: #38bdf8; fill-opacity: .12; stroke: #38bdf8; stroke-opacity: .45; }
    .tagt { font: 600 12px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #bae6fd; }
    .pill { font: 700 11px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 1.5px; }
    .monot{ font: 800 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #140d14; }
    .blob { animation: drift 9s ease-in-out infinite alternate; }
    .shine{ animation: sweep 7s ease-in-out infinite; }
    .dot  { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .in   { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-150px, 40px); } }
    @keyframes sweep { 0%, 55% { transform: translateX(-520px) skewX(-20deg); } 100% { transform: translateX(832px) skewX(-20deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .4; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="520" height="270" fill="url(#bg)"/>
    <ellipse class="blob" cx="480" cy="30" rx="230" ry="150" fill="url(#blob)"/>
    <rect class="shine" x="0" y="0" width="140" height="270" fill="url(#shine)"/>

    <g class="in">
      <rect x="24" y="24" width="52" height="52" rx="14" fill="url(#mono)"/>
      <text x="50" y="57" text-anchor="middle" class="monot">FD</text>
      <text x="92" y="50" class="name">Forge.Defcon</text>
      <text x="93" y="72" class="sub">Windows · anti-cheat · PC checks</text>
    </g>

    <g transform="translate(404 30)">
      <rect width="92" height="24" rx="12" fill="#38bdf8" fill-opacity=".16" stroke="#38bdf8" stroke-opacity=".6"/>
      <circle class="dot" cx="14" cy="12" r="3.5" fill="#38bdf8"/>
      <text x="26" y="16.5" class="pill" fill="#bae6fd">PUBLIC</text>
    </g>

    <g class="in" style="animation-delay:.15s">
      <text x="24" y="118" class="desc">WPF scanner for consent-based PC checks:</text>
      <text x="24" y="142" class="desc">20 modules that hunt cheats, HWID spoofers</text>
      <text x="24" y="166" class="desc">and DMA hardware. Single-exe CI releases.</text>
    </g>
    <g class="in" style="animation-delay:.3s"><g><rect x="24" y="220" width="35" height="26" rx="13" class="tag"/><text x="41.5" y="237.5" text-anchor="middle" class="tagt">C#</text></g><g><rect x="67" y="220" width="64" height="26" rx="13" class="tag"/><text x="99" y="237.5" text-anchor="middle" class="tagt">.NET 9</text></g><g><rect x="139" y="220" width="42" height="26" rx="13" class="tag"/><text x="160" y="237.5" text-anchor="middle" class="tagt">WPF</text></g><g><rect x="189" y="220" width="50" height="26" rx="13" class="tag"/><text x="214" y="237.5" text-anchor="middle" class="tagt">MVVM</text></g><g><rect x="247" y="220" width="64" height="26" rx="13" class="tag"/><text x="279" y="237.5" text-anchor="middle" class="tagt">SQLite</text></g><g><rect x="319" y="220" width="72" height="26" rx="13" class="tag"/><text x="355" y="237.5" text-anchor="middle" class="tagt">Actions</text></g></g>
    <rect x=".75" y=".75" width="518.5" height="268.5" rx="15.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  </g>
</svg>
