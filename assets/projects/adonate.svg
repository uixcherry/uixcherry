<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 270" width="520" height="270" role="img" aria-labelledby="t d">
  <title id="t">aDonate</title>
  <desc id="d">aDonate (private): Multi-tenant donation stores for game servers: SSR storefronts, owner dashboard, plugin API for in-game delivery and 8 payment gateways. Tech: Next.js 16, NestJS, PostgreSQL, Drizzle, Go, Docker.</desc>
  <defs>
    <clipPath id="card"><rect width="520" height="270" rx="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#120e17"/><stop offset="1" stop-color="#0c0a10"/></linearGradient>
    <radialGradient id="blob"><stop offset="0" stop-color="#ff6b35" stop-opacity=".30"/><stop offset="1" stop-color="#ff6b35" stop-opacity="0"/></radialGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb38a"/><stop offset="1" stop-color="#ff6b35"/></linearGradient>
    <linearGradient id="border" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="270" spreadMethod="repeat">
      <stop offset="0" stop-color="#ff6b35" stop-opacity=".12"/><stop offset=".45" stop-color="#ff6b35" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#ffb38a" stop-opacity=".95"/><stop offset=".55" stop-color="#ff6b35" stop-opacity=".12"/><stop offset="1" stop-color="#ff6b35" stop-opacity=".12"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-520 -270;520 270" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .name { font: 700 26px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #f8f1f4; }
    .sub  { font: 500 13px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #ffb38a; opacity: .85; }
    .desc { font: 400 15.5px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #c9bfc6; }
    .tag  { fill: #ff6b35; fill-opacity: .12; stroke: #ff6b35; stroke-opacity: .45; }
    .tagt { font: 600 12px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; fill: #ffb38a; }
    .pill { font: 700 11px 'JetBrains Mono', 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; letter-spacing: 1.5px; }
    .monot{ font: 800 20px 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif; fill: #140d14; }
    .blob { animation: drift 9s ease-in-out infinite alternate; }
    .shine{ animation: sweep 7s ease-in-out infinite; }
    .dot  { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .in   { animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-150px, 40px); } }
    @keyframes sweep { 0%, 55% { transform: translateX(-520px) skewX(-20deg); } 100% { transform: translateX(832px) skewX(-20deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: .4; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="520" height="270" fill="url(#bg)"/>
    <ellipse class="blob" cx="480" cy="30" rx="230" ry="150" fill="url(#blob)"/>
    <rect class="shine" x="0" y="0" width="140" height="270" fill="url(#shine)"/>

    <g class="in">
      <rect x="24" y="24" width="52" height="52" rx="14" fill="url(#mono)"/>
      <text x="50" y="57" text-anchor="middle" class="monot">aD</text>
      <text x="92" y="50" class="name">aDonate</text>
      <text x="93" y="72" class="sub">Minecraft · Rust · Unturned · alt:V · DayZ · PZ</text>
    </g>

    <g transform="translate(408 30)">
      <rect width="88" height="24" rx="12" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".18"/>
      <path d="M10.5 11v-2a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="#9b8fa3" stroke-width="1.6"/><rect x="9" y="11" width="10" height="7.5" rx="1.6" fill="#9b8fa3"/>
      <text x="25" y="16.5" class="pill" fill="#9b8fa3">PRIVATE</text>
    </g>

    <g class="in" style="animation-delay:.15s">
      <text x="24" y="118" class="desc">Multi-tenant donation stores for game servers:</text>
      <text x="24" y="142" class="desc">SSR storefronts, owner dashboard, plugin API</text>
      <text x="24" y="166" class="desc">for in-game delivery and 8 payment gateways.</text>
    </g>
    <g class="in" style="animation-delay:.3s"><g><rect x="24" y="220" width="94" height="26" rx="13" class="tag"/><text x="71" y="237.5" text-anchor="middle" class="tagt">Next.js 16</text></g><g><rect x="126" y="220" width="64" height="26" rx="13" class="tag"/><text x="158" y="237.5" text-anchor="middle" class="tagt">NestJS</text></g><g><rect x="198" y="220" width="94" height="26" rx="13" class="tag"/><text x="245" y="237.5" text-anchor="middle" class="tagt">PostgreSQL</text></g><g><rect x="300" y="220" width="72" height="26" rx="13" class="tag"/><text x="336" y="237.5" text-anchor="middle" class="tagt">Drizzle</text></g><g><rect x="380" y="220" width="35" height="26" rx="13" class="tag"/><text x="397.5" y="237.5" text-anchor="middle" class="tagt">Go</text></g><g><rect x="423" y="220" width="64" height="26" rx="13" class="tag"/><text x="455" y="237.5" text-anchor="middle" class="tagt">Docker</text></g></g>
    <rect x=".75" y=".75" width="518.5" height="268.5" rx="15.25" fill="none" stroke="url(#border)" stroke-width="1.5"/>
  </g>
</svg>
