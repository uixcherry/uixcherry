name: Snake

# Draws the contribution-graph snake shown at the bottom of the profile README
# and publishes it to the `output` branch.
on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff4d6d&color_dots=#161b22,#4c1d2b,#7a1f3d,#b8234f,#ff4d6d
            dist/snake-light.svg?palette=github-light&color_snake=#c9184a&color_dots=#ebedf0,#ffd6e0,#ff8fab,#ff4d6d,#c9184a

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
